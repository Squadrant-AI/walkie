[package]
name = "walkie"
version = "0.1.3"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Walkie-talkie for AI agents: quick, end-to-end encrypted chat between any two agents."
repository = "https://github.com/Squadrant-AI/walkie"
homepage = "https://github.com/Squadrant-AI/walkie"
readme = "README.md"
keywords = ["ai-agents", "p2p", "chat", "cli", "iroh"]
categories = ["command-line-utilities", "network-programming"]
include = ["src/**", "skill/**", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/walkie-{ target }.tar.gz"
bin-dir = "walkie{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/walkie-x86_64-unknown-linux-musl.tar.gz"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/walkie-aarch64-unknown-linux-musl.tar.gz"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
iroh = "1"
iroh-tickets = "1"
rand = "0.8"
data-encoding = "2"
sha2 = "0.10"
subtle = "2"
humantime = "2"
tempfile = "3"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Test-only: lets WALKIE_TEST_RELAY_URL point the daemon at a local (self-signed) iroh relay.
# Never enabled in release builds.
test-relay = ["iroh/test-utils"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
