[package]
name = "walkie"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Walkie-talkie for AI agents: quick, end-to-end encrypted chat between any two agents."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
iroh = "1"
iroh-tickets = "1"
rand = "0.8"
data-encoding = "2"
sha2 = "0.10"
subtle = "2"
humantime = "2"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Test-only: lets WALKIE_TEST_RELAY_URL point the daemon at a local (self-signed) iroh relay.
# Never enabled in release builds.
test-relay = ["iroh/test-utils"]

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
