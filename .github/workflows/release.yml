name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }   # cross-built on the arm64 runner
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Guard - release builds must not enable test-relay
        run: sh scripts/check-release-build.sh
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Guard - binary must not contain the test relay hook
        run: |
          if grep -aq WALKIE_TEST_RELAY_URL target/${{ matrix.target }}/release/walkie; then
            echo "release binary was built with test-relay (insecure TLS escape hatch)"; exit 1
          fi
      - run: |
          cd target/${{ matrix.target }}/release
          tar -czf walkie-${{ matrix.target }}.tar.gz walkie
          shasum -a 256 walkie-${{ matrix.target }}.tar.gz > walkie-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "target/${{ matrix.target }}/release/walkie-${{ matrix.target }}.tar.gz" }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/walkie-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/walkie-${{ matrix.target }}.tar.gz.sha256
            install.sh
